<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#160909" />
  <meta name="description" content="皇家遊戲大廳 — 夜色之中，盛宴即將開始。" />
  <title>皇家遊戲大廳</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="lobby" aria-label="皇家遊戲大廳">
    <header class="topbar">
      <div class="topbar-start">
        <a class="wordmark" href="/" aria-label="皇家遊戲大廳首頁"><span aria-hidden="true">♛</span> 首頁</a>
        <button id="player-widget" class="player-widget" type="button" aria-haspopup="dialog" aria-controls="profile-dialog" aria-label="打開玩家資訊">
          <span class="player-photo-frame" aria-hidden="true"><span class="player-photo"></span></span>
          <span class="player-widget-info">
            <span class="player-widget-title"><span>玩家資訊</span><span class="player-level">LV.1</span></span>
            <strong id="player-name">訪客玩家</strong>
            <span class="player-exp-label"><span>經驗值</span><span>0 / 100</span></span>
            <span class="player-exp-track" role="progressbar" aria-label="經驗值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></span>
          </span>
        </button>
      </div>
      <div class="account-area">
        <span id="user-label" class="user-label" hidden></span>
        <button id="auth-button" class="top-button" type="button">登入</button>
      </div>
    </header>
    <section class="brand" aria-label="大廳標題">
      <span class="hero-crown" aria-hidden="true">♛</span>
      <h1>皇家遊戲大廳</h1>
      <div class="rule" aria-hidden="true"></div>
      <p>夜色之中，盛宴即將開始</p>
    </section>
    <section class="game-gallery" aria-label="遊戲選擇">
      <article class="game-tile" aria-label="山海經，目前尚未開放">
        <img src="/game-art/shanhaijing.png" alt="山海經：金色九尾天狐與山海場景" />
        <span class="game-status">尚未開放</span>
      </article>
      <article class="game-tile" aria-label="應援全開，目前尚未開放">
        <img src="/game-art/yingyuan-quankai.png" alt="應援全開：紅、黃、綠、藍四位應援角色與舞台" />
        <span class="game-status">尚未開放</span>
      </article>
    </section>
    <div class="bottom-mark">A night of golden possibilities</div>
  </main>

  <dialog id="auth-dialog" class="dialog" aria-labelledby="auth-title">
    <button class="dialog-close" type="button" data-close="auth-dialog" aria-label="關閉">×</button>
    <span class="dialog-crown" aria-hidden="true">♛</span>
    <h2 id="auth-title">歡迎回來</h2>
    <p class="dialog-intro">登入或建立帳號，進入皇家大廳</p>
    <div class="mode-switch" role="tablist" aria-label="登入或註冊">
      <button id="login-tab" type="button" role="tab" aria-selected="true">登入</button>
      <button id="register-tab" type="button" role="tab" aria-selected="false">註冊</button>
    </div>
    <form id="auth-form" novalidate>
      <label for="account">帳號</label>
      <input id="account" name="account" type="text" autocomplete="username" minlength="1" maxlength="24" required placeholder="1–24 個字，帳號不可重複" />
      <label for="password">密碼</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="至少 10 個字元" />
      <p id="auth-message" class="form-message" aria-live="polite"></p>
      <button id="auth-submit" class="gold-button" type="submit">登入</button>
    </form>
    <p class="privacy-note">密碼會安全加密保存，不會以明文儲存。</p>
  </dialog>

  <dialog id="nickname-dialog" class="dialog nickname-dialog" aria-labelledby="nickname-title">
    <span class="dialog-crown" aria-hidden="true">♛</span>
    <h2 id="nickname-title">設定你的暱稱</h2>
    <p class="dialog-intro">取一個喜歡的名字，讓大家在大廳認識你。</p>
    <form id="nickname-form" novalidate>
      <label for="nickname">暱稱</label>
      <input id="nickname" name="nickname" type="text" autocomplete="nickname" maxlength="24" required placeholder="輸入 1–24 個字" />
      <p id="nickname-message" class="form-message" aria-live="polite"></p>
      <button id="nickname-submit" class="gold-button" type="submit">儲存暱稱</button>
    </form>
  </dialog>

  <dialog id="profile-dialog" class="dialog profile-dialog" aria-labelledby="profile-title">
    <button class="dialog-close" type="button" data-close="profile-dialog" aria-label="關閉">×</button>
    <span class="dialog-crown" aria-hidden="true">♛</span>
    <h2 id="profile-title">玩家資訊</h2>
    <div class="profile-identity">
      <div class="player-photo-frame" aria-hidden="true"><div class="player-photo"></div></div>
      <div class="profile-identity-copy">
        <span id="profile-level" class="player-level">LV.1</span>
        <strong id="profile-nickname">訪客玩家</strong>
        <span id="profile-account" class="profile-account">訪客模式</span>
      </div>
    </div>
    <div class="profile-exp-label"><span>經驗值</span><span id="profile-exp-text">0 / 100</span></div>
    <div class="player-exp-track profile-exp-track" role="progressbar" aria-label="玩家經驗值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    <dl class="profile-details">
      <div><dt>加入遊戲時間</dt><dd id="profile-joined">登入後顯示</dd></div>
      <div><dt>地區</dt><dd>尚未設定</dd></div>
      <div><dt>生日</dt><dd>尚未設定</dd></div>
      <div><dt>性別</dt><dd>尚未設定</dd></div>
    </dl>
    <button id="profile-login" class="gold-button" type="button">登入 / 註冊</button>
    <button id="profile-edit-nickname" class="gold-button" type="button" hidden>設定暱稱</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
